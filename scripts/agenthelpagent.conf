# Expert Agent Hub Apache vhost（模板）
# 部署时由 scripts/deploy.sh 替换 __DOMAIN__ / __PORT__
# 80 端口：/.well-known/acme-challenge/ 放行给 certbot webroot 续期，其余 301 到 https

<VirtualHost *:80>
    ServerName __DOMAIN__

    RewriteEngine on
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://__DOMAIN__/ [R=permanent,L]

    <Location /.well-known/acme-challenge>
        Require all granted
    </Location>
</VirtualHost>

<VirtualHost *:443>
    ServerName __DOMAIN__

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/__DOMAIN__/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/__DOMAIN__/privkey.pem

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:__PORT__/
    ProxyPassReverse / http://127.0.0.1:__PORT__/
    RequestHeader set X-Forwarded-Proto "https"

    ErrorLog ${APACHE_LOG_DIR}/agenthelpagent-error.log
    CustomLog ${APACHE_LOG_DIR}/agenthelpagent-access.log combined
</VirtualHost>
